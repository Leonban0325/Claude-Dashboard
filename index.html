<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#0a0e17;color:#c8d6e5;font-family:'JetBrains Mono','SF Mono',monospace;font-size:12px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#0a0e17}
::-webkit-scrollbar-thumb{background:#1a2744;border-radius:3px}
::selection{background:#00dd8833}
button{font-family:inherit;cursor:pointer;border:none;transition:all .12s}
button:hover{filter:brightness(1.25)}
input,select{font-family:inherit}
input:focus,select:focus{outline:none;border-color:#00dd8855!important}
.topbar{background:#0d1220;border-bottom:1px solid #1a2233;padding:7px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.brand{font-size:13px;font-weight:700;color:#ff8800;letter-spacing:.8px;margin-right:14px}
.tabs{display:flex;gap:2px}
.tab{background:transparent;color:#556677;border:1px solid transparent;border-radius:3px;padding:3px 11px;font-size:10px;font-weight:600;letter-spacing:.4px}
.tab.on{background:#1a2744;color:#00dd88;border-color:#00dd8833}
.rbadge{border-radius:4px;padding:2px 9px;display:flex;align-items:center;gap:5px}
.rdot{width:6px;height:6px;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.rlbl{font-weight:700;font-size:10px}
.clock{color:#445566;font-size:9px}
.refresh{background:#111827;color:#556677;border:1px solid #1a2744;border-radius:3px;padding:2px 8px;font-size:9px;margin-left:8px}
.refresh:hover{color:#00dd88;border-color:#00dd8844}
.refresh.spin{animation:spin .8s linear}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.alerts{background:#111827;border-bottom:1px solid #1a2233;padding:3px 14px;display:flex;gap:14px;font-size:9px;overflow-x:auto;white-space:nowrap;min-height:0}
.alerts:empty{display:none}
.main{padding:10px;overflow-y:auto;height:calc(100vh - 70px)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.s2{grid-column:span 2}
.panel{background:#0d1220;border:1px solid #1a2233;border-radius:5px;overflow:hidden}
.phdr{background:#111827;padding:5px 10px;border-bottom:1px solid #1a2233;font-size:9px;font-weight:700;letter-spacing:.5px;color:#7a8899}
.pbd{padding:0}
/* ── Sub-section headers inside panels ── */
.sec-hdr{padding:4px 10px 2px;font-size:8px;font-weight:700;letter-spacing:.4px;border-bottom:1px solid #1a2233}
.sec-hdr.top{border-top:1px solid #1a2233}
table{width:100%;border-collapse:collapse}
th{padding:5px 8px;text-align:left;border-bottom:1px solid #222d3d;font-size:9px;font-weight:600;letter-spacing:.4px;color:#556677;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:#88aacc}
th.on{color:#00dd88}
th.r{text-align:right}
th.c{text-align:center}
td{padding:4px 8px;border-bottom:1px solid #0f1724;font-size:11px}
td.r{text-align:right}
td.c{text-align:center}
td.tk{font-weight:700;color:#e8f0ff}
td.dim{color:#7a8899;font-size:10px}
td.dimx{color:#556677;font-size:10px}
tr:hover{background:#ffffff05}
.heatgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px}
.htile{border:1px solid #1a223355;border-radius:5px;padding:7px 5px;display:flex;flex-direction:column;align-items:center;position:relative;min-height:66px;transition:all .2s;cursor:pointer}
.htile.tier1{min-height:80px}
.htile.tier2{min-height:68px}
.htile.tier3{min-height:58px}
.htile:hover{border-color:#ffffff22;transform:translateY(-1px)}
.htile.active{border-color:#ff880088;box-shadow:0 0 12px #ff880022}
.htile .rk{font-size:8px;color:#556677;position:absolute;top:2px;right:4px}
.htile .tk{font-size:12px;font-weight:800;color:#e8f0ff}
.htile .nm{font-size:7px;color:#7a8899;text-align:center;margin:1px 0}
.htile .cv{font-size:11px;font-weight:700}
.htile .qd{font-size:7px;margin-top:1px}
.htile .sub{display:flex;gap:6px;margin-top:2px;font-size:7px}
.htile .vdict{font-size:6px;margin-top:1px;font-weight:600}
.htile .drill-hint{font-size:6px;color:#33445566;margin-top:2px;transition:color .2s}
.htile:hover .drill-hint{color:#556677}
.badge{padding:1px 5px;border-radius:3px;font-size:8px}
.search{background:#111827;border:1px solid #1a2744;border-radius:4px;padding:5px 10px;color:#c8d6e5;font-size:11px;width:250px}
.filt{background:#111827;border:1px solid #1a2744;border-radius:4px;padding:5px 7px;color:#c8d6e5;font-size:10px}
.bar{height:7px;background:#1a2233;border-radius:4px;overflow:hidden;width:55px}
.bar-fill{height:100%;border-radius:4px}
.pbar{padding:1px 5px;border-radius:2px;font-size:9px}
.loader{display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:12px}
.loader-ring{width:30px;height:30px;border:3px solid #1a2744;border-top-color:#00dd88;border-radius:50%;animation:spin .8s linear infinite}
.loader-txt{color:#556677;font-size:11px}
.subtabs{display:flex;gap:3px;margin-bottom:10px}
.stab{background:transparent;color:#556677;border:1px solid transparent;border-radius:3px;padding:3px 10px;font-size:10px;font-weight:600}
.stab.on{background:#1a2744;color:#00dd88;border-color:#00dd8833}
/* ── What Changed panel ── */
.changes-panel{background:#0d1220;border:1px solid #1a2233;border-radius:5px;margin-bottom:10px;overflow:hidden}
.changes-hdr{background:#111827;padding:5px 10px;border-bottom:1px solid #1a2233;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.changes-hdr:hover{background:#151e30}
.changes-title{font-size:9px;font-weight:700;letter-spacing:.5px;color:#ff8800}
.changes-toggle{font-size:9px;color:#556677;transition:transform .2s}
.changes-body{padding:0 10px}
.changes-body.collapsed{display:none}
.change-item{padding:5px 0;border-bottom:1px solid #0f1724;display:flex;align-items:center;gap:8px;font-size:11px}
.change-item:last-child{border-bottom:none}
.change-icon{font-size:12px;width:16px;text-align:center;flex-shrink:0}
.change-type{font-size:7px;font-weight:700;letter-spacing:.5px;padding:1px 5px;border-radius:2px;flex-shrink:0}
.change-msg{color:#c8d6e5}
.changes-empty{padding:8px 0;color:#445566;font-size:10px;text-align:center}
.changes-meta{padding:4px 0 6px;font-size:8px;color:#334455;text-align:right}
/* ── Drill-down panel ── */
.drill-panel{background:#0a0e17;border:1px solid #ff880033;border-radius:5px;margin-top:8px;overflow:hidden;animation:drillIn .2s ease}
@keyframes drillIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.drill-hdr{background:#1a1400;padding:5px 10px;border-bottom:1px solid #ff880022;display:flex;align-items:center;justify-content:space-between}
.drill-title{font-size:10px;font-weight:700;color:#ff8800;letter-spacing:.4px}
.drill-close{background:transparent;color:#556677;font-size:11px;padding:2px 6px;border-radius:3px}
.drill-close:hover{color:#ff8800;background:#ff880011}
.drill-count{font-size:8px;color:#556677;margin-left:8px}
/* ── Drill chart + table split ── */
.drill-body{display:flex;align-items:stretch}
.drill-chart-side{width:380px;flex-shrink:0;border-right:1px solid #ff880022;display:flex;flex-direction:column}
.drill-chart-hdr{padding:4px 10px;font-size:8px;color:#556677;background:#0d1220;border-bottom:1px solid #1a2233;display:flex;align-items:center;gap:5px;flex-shrink:0}
.drill-chart-hdr .ctkr{color:#ff8800;font-weight:700;font-size:10px}
.drill-chart-hdr .csub{color:#334455;font-size:7px;margin-left:auto}
#tv_chart{flex:1;min-height:360px}
.drill-table-side{flex:1;min-width:0;overflow-x:auto}
.drill-row{cursor:pointer}
.drill-row.active-chart{background:#ff880011!important}
.drill-row.active-chart .tk{color:#ff8800!important}
/* ── Conviction label truncation ── */
.cvlabel{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:8px;display:inline-block}
/* ── Profile slide-in panel ── */
.profile-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:#00000055;z-index:199;opacity:0;pointer-events:none;transition:opacity .25s}
.profile-backdrop.open{opacity:1;pointer-events:auto}
.profile-overlay{position:fixed;top:0;right:0;bottom:0;width:380px;background:#0a0e17;border-left:1px solid #1a2233;z-index:200;overflow-y:auto;transform:translateX(100%);transition:transform .25s ease;box-shadow:-4px 0 24px #00000066}
.profile-overlay.open{transform:translateX(0)}
.prof-hdr{padding:10px 12px;border-bottom:1px solid #1a2233;display:flex;align-items:flex-start;justify-content:space-between}
.prof-close{background:transparent;color:#556677;font-size:14px;padding:2px 6px;border-radius:3px;flex-shrink:0}
.prof-close:hover{color:#ff5555;background:#ff555511}
.prof-sec{margin:8px 10px;border:1px solid #1a2233;border-radius:5px;overflow:hidden}
.prof-sec-hdr{padding:4px 8px;font-size:8px;font-weight:700;letter-spacing:.5px;color:#556677;background:#111827;border-bottom:1px solid #1a2233}
.prof-sec-body{padding:6px 8px}
.prof-row{display:flex;justify-content:space-between;padding:2px 0;font-size:10px}
.prof-lbl{color:#556677}
.prof-val{font-weight:600}
.prof-bigrs{font-size:20px;font-weight:800;text-align:center;padding:6px 0}
.prof-bar{height:6px;background:#1a2233;border-radius:3px;overflow:hidden;margin:4px 0}
.prof-bar-fill{height:100%;border-radius:3px}
.prof-peer{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid #0f1724;font-size:10px}
.prof-peer:last-child{border-bottom:none}
.prof-btn{display:block;margin:10px;padding:8px;text-align:center;background:#111827;border:1px solid #1a2744;border-radius:4px;color:#44aaff;font-size:10px;font-weight:600;cursor:pointer}
.prof-btn:hover{background:#1a2744;color:#00dd88}
/* ── Bottom 10 ── */
.bot10-row{border-left:2px solid #ff555544}
/* ── Region / Theme heatmap grid ── */
.region-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:5px;padding:8px}
.rtile{border:1px solid #1a223355;border-radius:4px;padding:6px 8px;cursor:pointer;transition:all .15s}
.rtile:hover{border-color:#ffffff22;transform:translateY(-1px)}
.rtile.active{border-color:#ff880088;box-shadow:0 0 10px #ff880022}
.rtile .rt-region{font-size:9px;font-weight:700;color:#e8f0ff;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtile .rt-rs{font-size:13px;font-weight:800}
.rtile .rt-meta{font-size:7px;color:#556677;margin-top:1px}
/* ── Hot/Cold theme pills ── */
.theme-bar{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;border-bottom:1px solid #1a2233;align-items:center}
.tpill{padding:3px 8px;border-radius:12px;font-size:9px;font-weight:700;cursor:pointer;transition:all .15s;border:1px solid transparent}
.tpill:hover{filter:brightness(1.2)}
.tpill.active{border-color:#ff8800!important}
/* ── Sprint 3: Widget Grid ── */
#gridContainer{position:relative;width:100%}
.grid-item{position:absolute;box-sizing:border-box;transition:box-shadow .15s}
.grid-item.editing{outline:1px dashed #1a3344}
.grid-item.dragging{opacity:.7;box-shadow:0 8px 32px #00000066;z-index:50;cursor:grabbing}
.grid-item.resizing{z-index:50;box-shadow:0 8px 32px #00000066}
.grid-ghost{position:absolute;background:#00dd8812;border:1px dashed #00dd8855;border-radius:5px;pointer-events:none;z-index:49}
.widget-header{display:none;background:#080c14;padding:4px 8px;border-bottom:1px solid #1a2233;align-items:center;cursor:grab;user-select:none;height:26px;flex-shrink:0}
.grid-item.editing .widget-header{display:flex}
.widget-header-label{font-size:8px;font-weight:700;letter-spacing:.5px;color:#33445566;flex:1;margin-left:4px}
.widget-collapse-btn{background:transparent;color:#33445566;font-size:9px;padding:1px 5px;border-radius:2px;cursor:pointer;border:none}
.widget-collapse-btn:hover{color:#00dd88;background:#00dd8811}
.widget-remove-btn{display:none;background:transparent;color:#334455;font-size:9px;padding:1px 5px;border-radius:2px;cursor:pointer;border:none}
.widget-remove-btn:hover{color:#ff5555;background:#ff555511}
.grid-item.editing .widget-remove-btn{display:block}
.resize-handle{display:none;position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;z-index:55}
.resize-handle::after{content:'';position:absolute;right:3px;bottom:3px;width:8px;height:8px;border-right:2px solid #334455;border-bottom:2px solid #334455;border-radius:1px;opacity:0;transition:opacity .15s}
.grid-item.editing .resize-handle{display:block}
.grid-item.editing:hover .resize-handle::after{opacity:1}
.widget-body{overflow-y:auto;overflow-x:hidden}
.grid-item.collapsed .widget-body{display:none}
.layout-toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#080c14;border-bottom:1px solid #1a2233;margin-bottom:10px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
.lt-btn{background:#111827;color:#445566;border:1px solid #1a2744;border-radius:3px;padding:3px 9px;font-size:9px;font-weight:700;letter-spacing:.4px;font-family:inherit;cursor:pointer}
.lt-btn:hover{color:#c8d6e5;border-color:#334466}
.lt-btn.active{background:#1a2744;color:#00dd88;border-color:#00dd8833}
.lt-btn.danger{color:#ff8844;border-color:#ff884433}
.lt-btn.danger:hover{color:#ff5555;background:#ff555511}
.lt-sep{width:1px;height:16px;background:#1a2233;margin:0 2px}
.lt-label{font-size:8px;color:#334455;letter-spacing:.4px;margin-left:auto}
.widget-picker-wrap{position:relative}
.widget-picker{position:absolute;top:28px;left:0;background:#0d1220;border:1px solid #1a2744;border-radius:4px;min-width:200px;z-index:200;box-shadow:0 8px 24px #00000066}
.widget-picker-item{padding:6px 10px;font-size:10px;cursor:pointer;color:#c8d6e5;border-bottom:1px solid #1a2233}
.widget-picker-item:last-child{border-bottom:none}
.widget-picker-item:hover{background:#111827;color:#00dd88}
.widget-picker-item.disabled{color:#334455;cursor:default}
.widget-picker-item.disabled:hover{background:transparent;color:#334455}
.toast{position:fixed;bottom:24px;right:24px;background:#0d1220;border:1px solid #1a2744;border-radius:4px;padding:8px 14px;font-size:10px;font-weight:600;color:#c8d6e5;z-index:9999;box-shadow:0 4px 16px #00000055;transform:translateY(8px);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{border-color:#00dd8844;color:#00dd88}
.toast.warning{border-color:#ff884444;color:#ff8844}
/* ── AI Pulse ── */
.ai-loading::after{content:'.';animation:aiDots 1.5s infinite}
@keyframes aiDots{0%{content:'.';}33%{content:'..';}66%{content:'...';}100%{content:'';}}
#aiChatInput:focus{border-color:#ff880044;outline:none}
</style>
<script src="https://s3.tradingview.com/tv.js"></script>
</head>

// 3c. Grid constants + math
var GRID_COLS=12, GRID_ROW_H=60, GRID_GAP=10;
function cellWidth(){var el=document.getElementById('gridContainer');var cw=el?el.offsetWidth:(window.innerWidth-20);return(cw-(GRID_COLS-1)*GRID_GAP)/GRID_COLS;}
function gridToPixels(item){var cw=cellWidth();return{left:item.x*(cw+GRID_GAP),top:item.y*(GRID_ROW_H+GRID_GAP),width:item.w*cw+(item.w-1)*GRID_GAP,height:item.h*GRID_ROW_H+(item.h-1)*GRID_GAP};}
function pixelsToGrid(px,py){var cw=cellWidth();return{x:Math.max(0,Math.min(GRID_COLS-1,Math.round(px/(cw+GRID_GAP)))),y:Math.max(0,Math.round(py/(GRID_ROW_H+GRID_GAP)))};}
function clampItem(item){if(item.x<0)item.x=0;if(item.x+item.w>GRID_COLS)item.x=GRID_COLS-item.w;if(item.x<0)item.x=0;if(item.y<0)item.y=0;return item;}
function calcContainerHeight(layout){var m=0;layout.forEach(function(i){var b=i.y+i.h;if(b>m)m=b;});return m*(GRID_ROW_H+GRID_GAP)+GRID_GAP;}

// 3d. Collision resolution + compaction
function itemsOverlap(a,b){if(a.id===b.id)return false;return!(a.x+a.w<=b.x||b.x+b.w<=a.x||a.y+a.h<=b.y||b.y+b.h<=a.y);}
function resolveCollisions(layout,movedId){
  for(var pass=0;pass<2;pass++){
    layout.sort(function(a,b){if(a.id===movedId)return-1;if(b.id===movedId)return 1;return a.y!==b.y?a.y-b.y:a.x-b.x;});
    for(var i=0;i<layout.length;i++)for(var j=i+1;j<layout.length;j++)if(itemsOverlap(layout[i],layout[j]))layout[j].y=layout[i].y+layout[i].h;
  }
  return layout;
}
function compactLayout(layout){
  layout.sort(function(a,b){return a.y!==b.y?a.y-b.y:a.x-b.x;});
  for(var i=0;i<layout.length;i++){
    var item=layout[i];
    while(item.y>0){item.y--;var col=false;for(var j=0;j<i;j++){if(itemsOverlap(item,layout[j])){col=true;break;}}if(col){item.y++;break;}}
  }
  return layout;
}

// 3h. Drag handlers
function attachDragHandlers(){
  document.querySelectorAll('.widget-header').forEach(function(hdr){
    hdr.addEventListener('mousedown',function(e){
      if(e.target.classList.contains('widget-collapse-btn')||e.target.classList.contains('widget-remove-btn'))return;
      startDrag(hdr.closest('.grid-item'),e.clientX,e.clientY);
    });
    hdr.addEventListener('touchstart',function(e){
      if(e.target.classList.contains('widget-collapse-btn')||e.target.classList.contains('widget-remove-btn'))return;
      var t=e.touches[0];startDrag(hdr.closest('.grid-item'),t.clientX,t.clientY);e.preventDefault();
    },{passive:false});
  });
}
function startDrag(el,startX,startY){
  var wid=el.getAttribute('data-wid');
  var origLeft=parseFloat(el.style.left)||0,origTop=parseFloat(el.style.top)||0;
  var ghost=document.getElementById('gridGhost');
  el.classList.add('dragging');
  function onMove(cx,cy){
    var dx=cx-startX,dy=cy-startY;
    el.style.left=(origLeft+dx)+'px';el.style.top=(origTop+dy)+'px';
    var gp=pixelsToGrid(origLeft+dx,origTop+dy);
    var item=S.layout.filter(function(i){return i.id===wid;})[0];
    if(item){var px=gridToPixels({x:gp.x,y:gp.y,w:item.w,h:item.h});ghost.style.cssText='display:block;left:'+px.left.toFixed(1)+'px;top:'+px.top.toFixed(1)+'px;width:'+px.width.toFixed(1)+'px;height:'+px.height.toFixed(1)+'px;';}
  }
  function onUp(cx,cy){
    el.classList.remove('dragging');ghost.style.display='none';
    var dx=cx-startX,dy=cy-startY;
    var gp=pixelsToGrid(origLeft+dx,origTop+dy);
    var item=S.layout.filter(function(i){return i.id===wid;})[0];
    if(item){item.x=gp.x;item.y=gp.y;clampItem(item);resolveCollisions(S.layout,wid);compactLayout(S.layout);}
    applyLayoutToDOM(S.layout);
    if(wid==='tvChart'){if(_tvWidget){try{_tvWidget.remove();}catch(e){}_tvWidget=null;}setTimeout(function(){initTVChart(S.chartTicker||S.drillSector);},150);}
    document.removeEventListener('mousemove',mmove);document.removeEventListener('mouseup',mup);
    document.removeEventListener('touchmove',tmove);document.removeEventListener('touchend',tup);
  }
  function mmove(e){onMove(e.clientX,e.clientY);}
  function mup(e){onUp(e.clientX,e.clientY);}
  function tmove(e){var t=e.touches[0];onMove(t.clientX,t.clientY);e.preventDefault();}
  function tup(e){var t=e.changedTouches[0];onUp(t.clientX,t.clientY);}
  document.addEventListener('mousemove',mmove);document.addEventListener('mouseup',mup);
  document.addEventListener('touchmove',tmove,{passive:false});document.addEventListener('touchend',tup);
}

// 3i. Resize handlers
function attachResizeHandlers(){
  document.querySelectorAll('.resize-handle').forEach(function(rh){
    rh.addEventListener('mousedown',function(e){e.stopPropagation();startResize(rh.closest('.grid-item'),e.clientX,e.clientY);});
    rh.addEventListener('touchstart',function(e){e.stopPropagation();e.preventDefault();var t=e.touches[0];startResize(rh.closest('.grid-item'),t.clientX,t.clientY);},{passive:false});
  });
}
function startResize(el,startX,startY){
  var wid=el.getAttribute('data-wid');
  var origW=parseFloat(el.style.width)||100,origH=parseFloat(el.style.height)||60;
  var def=getWidgetDef(wid);
  var minPxW=def?def.minW*(cellWidth()+GRID_GAP)-GRID_GAP:60;
  var minPxH=def?def.minH*(GRID_ROW_H+GRID_GAP)-GRID_GAP:60;
  el.classList.add('resizing');
  function onMove(cx,cy){
    var nw=Math.max(minPxW,origW+(cx-startX)),nh=Math.max(minPxH,origH+(cy-startY));
    el.style.width=nw+'px';el.style.height=nh+'px';
    var body=el.querySelector('.widget-body');if(body)body.style.height=(nh-26)+'px';
  }
  function onUp(cx,cy){
    el.classList.remove('resizing');
    var cw=cellWidth();
    var nw=Math.max(minPxW,origW+(cx-startX)),nh=Math.max(minPxH,origH+(cy-startY));
    var gw=Math.max(def?def.minW:2,Math.round((nw+GRID_GAP)/(cw+GRID_GAP)));
    var gh=Math.max(def?def.minH:2,Math.round((nh+GRID_GAP)/(GRID_ROW_H+GRID_GAP)));
    if(gw>GRID_COLS)gw=GRID_COLS;
    var item=S.layout.filter(function(i){return i.id===wid;})[0];
    if(item){item.w=gw;item.h=gh;clampItem(item);resolveCollisions(S.layout,wid);compactLayout(S.layout);}
    applyLayoutToDOM(S.layout);
    if(wid==='tvChart'){if(_tvWidget){try{_tvWidget.remove();}catch(e){}_tvWidget=null;}setTimeout(function(){initTVChart(S.chartTicker||S.drillSector);},150);}
    document.removeEventListener('mousemove',mmove);document.removeEventListener('mouseup',mup);
    document.removeEventListener('touchmove',tmove);document.removeEventListener('touchend',tup);
  }
  function mmove(e){onMove(e.clientX,e.clientY);}
  function mup(e){onUp(e.clientX,e.clientY);}
  function tmove(e){var t=e.touches[0];onMove(t.clientX,t.clientY);e.preventDefault();}
  function tup(e){var t=e.changedTouches[0];onUp(t.clientX,t.clientY);}
  document.addEventListener('mousemove',mmove);document.addEventListener('mouseup',mup);
  document.addEventListener('touchmove',tmove,{passive:false});document.addEventListener('touchend',tup);
}

// 3j. applyLayoutToDOM
function applyLayoutToDOM(layout){
  var c=document.getElementById('gridContainer');if(!c)return;
  layout.forEach(function(item){
    var el=document.getElementById('wi_'+item.id);if(!el)return;
    var px=gridToPixels(item);
    el.style.left=px.left.toFixed(1)+'px';el.style.top=px.top.toFixed(1)+'px';
    el.style.width=px.width.toFixed(1)+'px';el.style.height=px.height.toFixed(1)+'px';
    var body=el.querySelector('.widget-body');
    if(body)body.style.height=(px.height-(S.layoutLocked?0:26)).toFixed(1)+'px';
  });
  c.style.height=calcContainerHeight(layout)+'px';
}

function addWidget(wid){
  if(S.layoutLocked)return;
  var layout=getActiveLayout();
  var already=layout.filter(function(i){return i.id===wid;}).length>0;
  if(already)return;
  var def=getWidgetDef(wid);if(!def)return;
  var maxY=0;layout.forEach(function(i){var b=i.y+i.h;if(b>maxY)maxY=b;});
  layout.push({id:wid,x:0,y:maxY,w:def.defaultW,h:def.defaultH});
  S.layout=layout;S.gridInitialized=false;
  initGrid();
}

function toggleWidgetCollapse(wid){

function removeWidget(wid){

  initGrid();showToast('Widget removed');

function vc(v){if(v==null||isNaN(v))return'#555';return v>0?'#00dd88':v<0?'#ff5555':'#778';}
function sc(s){if(!s)return'#555';s=String(s);if(s.indexOf('CONFIRMED OFF')!==-1||s.indexOf('STRESS')!==-1)return'#ff4444';if(s.indexOf('TURNING OFF')!==-1||s.indexOf('DETERIORAT')!==-1)return'#ff8844';if(s.indexOf('TURNING ON')!==-1||s.indexOf('IMPROV')!==-1)return'#44aaff';if(s.indexOf('CONFIRMED')!==-1)return'#00dd88';return'#888';}
function tc(t){if(!t)return'#555';t=String(t);if(t.indexOf('▲▲')!==-1)return'#00dd88';if(t.indexOf('▲')!==-1)return'#44aaff';if(t.indexOf('▼▼')!==-1)return'#ff4444';if(t.indexOf('▼')!==-1)return'#ff8844';return'#888';}
function qc(q){if(!q)return'#555';q=String(q);if(q.indexOf('SURGING')!==-1)return'#00E676';if(q.indexOf('LEADING')!==-1)return'#00dd88';if(q.indexOf('IMPROVING')!==-1)return'#44aaff';if(q.indexOf('FADING')!==-1)return'#ff8844';if(q.indexOf('WEAKENING')!==-1)return'#FF6D00';if(q.indexOf('COLLAPSING')!==-1)return'#ff4444';if(q.indexOf('LAGGING')!==-1)return'#D50000';return'#888';}
function rc(v){if(!v)return'#888';v=String(v);if(v.indexOf('BULL')!==-1||v.indexOf('RISK-ON')!==-1||v.indexOf('CALM')!==-1||v.indexOf('GLOBAL ON')!==-1)return'#00dd88';if(v.indexOf('NEUTRAL')!==-1)return'#ffaa00';if(v.indexOf('VALUE')!==-1)return'#44aaff';return'#ff5555';}
function wt(v){if(v===null||v===undefined||v==='')return'—';if(typeof v==='string'&&v.indexOf('%')!==-1)return v;var n=parseFloat(v);if(isNaN(n))return String(v);return(n>0&&n<=1?(n*100).toFixed(0):n.toFixed(0))+'%';}
function hc(v){if(v==null)return'#1a1a2e';var n=v*100;if(n>15)return'#00884480';if(n>8)return'#00dd8855';if(n>3)return'#00dd8833';if(n>0)return'#00dd8818';if(n>-3)return'#ff444418';if(n>-8)return'#ff444433';if(n>-15)return'#ff555555';return'#ff444480';}
function typeBg(t){t=String(t);if(t==='SECTOR')return'background:#1a2744;color:#44aaff';if(t==='THEMATIC')return'background:#2a1a33;color:#bb77dd';if(t==='INTL')return'background:#1a3322;color:#44dd88';return'background:#1a2233;color:#888';}
// verdict badge color for sector tiles
function verdictColor(v){if(!v)return'';v=String(v);if(v.indexOf('▲ OVERWEIGHT')!==-1)return'#00dd88';if(v.indexOf('● MARKET')!==-1)return'#888';if(v.indexOf('○ UNDERWEIGHT')!==-1)return'#ff8844';if(v.indexOf('▼ UNDERWEIGHT')!==-1)return'#ff5555';return'#888';}
// conviction label color
function cvlColor(l){if(!l)return'#555';l=String(l);if(l.indexOf('STRONG')!==-1||l.indexOf('SOLID')!==-1)return'#00dd88';if(l.indexOf('FADING')!==-1)return'#ff8844';if(l.indexOf('WEAK')!==-1)return'#ff5555';return'#888';}
// note color for emerging
function noteColor(n){if(!n)return'#556677';n=String(n);if(n.indexOf('CONFIRMED')!==-1)return'#00dd88';if(n.indexOf('EMERGING')!==-1)return'#44aaff';if(n.indexOf('ACCELERATING')!==-1)return'#ffaa00';return'#556677';}
function spark(vals,w,h){
  w=w||70;h=h||22;
  var cl=[];for(var i=0;i<vals.length;i++){if(vals[i]!=null&&!isNaN(vals[i]))cl.push(vals[i]);}
  if(cl.length<2)return'<span style="color:#333;font-size:8px">—</span>';
  function catmullRom(pts,nSeg){var out=[pts[0]];for(var i=0;i<pts.length-1;i++){var p0=pts[Math.max(i-1,0)];var p1=pts[i];var p2=pts[i+1];var p3=pts[Math.min(i+2,pts.length-1)];for(var t=1;t<=nSeg;t++){var f=t/nSeg;var f2=f*f,f3=f2*f;var v=0.5*((2*p1)+(-p0+p2)*f+(2*p0-5*p1+4*p2-p3)*f2+(-p0+3*p1-3*p2+p3)*f3);out.push(v);}}return out;}
  var smooth=catmullRom(cl,6);
  var mn=Math.min.apply(null,smooth.concat([0]));var mx=Math.max.apply(null,smooth.concat([0]));var rng=mx-mn||1;var pad=1.5;var iw=w-pad*2,ih=h-pad*2;
  function vx(i,len){return pad+(i/(len-1))*iw;}function vy(v){return pad+(ih-((v-mn)/rng)*ih);}var zy=vy(0);
  var pts=[];for(var i=0;i<smooth.length;i++){pts.push(vx(i,smooth.length).toFixed(1)+','+vy(smooth[i]).toFixed(1));}
  var areaPath='M'+vx(0,smooth.length).toFixed(1)+','+zy.toFixed(1);for(var i=0;i<smooth.length;i++){areaPath+=' L'+vx(i,smooth.length).toFixed(1)+','+vy(smooth[i]).toFixed(1);}areaPath+=' L'+vx(smooth.length-1,smooth.length).toFixed(1)+','+zy.toFixed(1)+' Z';
  var accel=cl[cl.length-1]>=cl[0];var cMain=accel?'#00dd88':'#ff5555';var cGlow=accel?'#00dd88':'#ff5555';
  var lx=vx(smooth.length-1,smooth.length).toFixed(1);var ly=vy(smooth[smooth.length-1]).toFixed(1);
  var gid='sg'+Math.random().toString(36).substr(2,5);
  var svg='<svg width="'+w+'" height="'+h+'" style="vertical-align:middle">';
  svg+='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+cMain+'" stop-opacity="0.25"/><stop offset="100%" stop-color="'+cMain+'" stop-opacity="0.02"/></linearGradient></defs>';
  svg+='<line x1="'+pad+'" y1="'+zy.toFixed(1)+'" x2="'+(w-pad)+'" y2="'+zy.toFixed(1)+'" stroke="#ffffff10" stroke-width="0.5" stroke-dasharray="2,2"/>';
  svg+='<path d="'+areaPath+'" fill="url(#'+gid+')" />';
  svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+cMain+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
  for(var i=0;i<cl.length;i++){var rx=vx(i*6<smooth.length?i*6:smooth.length-1,smooth.length).toFixed(1);var ry=vy(cl[i]).toFixed(1);svg+='<circle cx="'+rx+'" cy="'+ry+'" r="1" fill="'+cMain+'" opacity="0.5"/>';}
  svg+='<circle cx="'+lx+'" cy="'+ly+'" r="4" fill="'+cGlow+'" opacity="0.12"/>';
  svg+='<circle cx="'+lx+'" cy="'+ly+'" r="2" fill="'+cMain+'" opacity="0.9"/>';
  svg+='</svg>';return svg;
}
function ann(w1,m1,m3,m6,m12){return[m12==null?null:m12,m6==null?null:m6*2,m3==null?null:m3*4,m1==null?null:m1*12,w1==null?null:w1*52];}
function getVerdict(signals){if(!signals||!signals.length)return{label:'LOADING',color:'#556677',bg:'#11182700'};var bull=0,bear=0;signals.forEach(function(s){var v=String(s.verdict);if(v.indexOf('BULL')!==-1||v.indexOf('RISK-ON')!==-1||v.indexOf('CALM')!==-1||v.indexOf('GLOBAL ON')!==-1)bull++;if(v.indexOf('BEAR')!==-1||v.indexOf('RISK-OFF')!==-1||v.indexOf('FEAR')!==-1)bear++;});if(bull>=4)return{label:'RISK-ON',color:'#00dd88',bg:'#00dd8815'};if(bull>=3)return{label:'CONSTRUCTIVE',color:'#44ddaa',bg:'#44ddaa12'};if(bear>=3)return{label:'CAUTIOUS',color:'#ff8844',bg:'#ff884412'};if(bear>=4)return{label:'RISK-OFF',color:'#ff4444',bg:'#ff444415'};return{label:'MIXED',color:'#ffaa00',bg:'#ffaa0012'};}

function loadData(){
  document.getElementById('refreshBtn').classList.add('spin');
  setTimeout(function(){document.getElementById('refreshBtn').classList.remove('spin');},800);
  google.script.run.withSuccessHandler(function(json){
    try{S.data=JSON.parse(json);}catch(e){S.data=null;}

}

  renderTabs();
  var v=getVerdict(S.data.regime.signals);

  renderAlerts();

    if(!S.gridInitialized){
      initGrid();

      getActiveLayout().forEach(function(item){renderWidgetById(item.id);});
      if(S.drillSector)setTimeout(function(){initTVChart(S.chartTicker||S.drillSector);},100);
    }
  } else {
    S.gridInitialized=false;
    if(S.tab==='UNIVERSE')renderUniverse();

function renderAlerts(){
  var d=S.data,h='';
  if(d.rotation){
    // Confirmed pairs
    (d.rotation.pairs||[]).forEach(function(p){
      if(String(p.signal).indexOf('CONFIRMED')!==-1&&String(p.signal).indexOf('OFF')===-1)h+='<span style="color:#00dd88">✦ '+p.pair+': '+p.desc+' CONFIRMED</span>';
    });
    // Turning on/off
    (d.rotation.pairs||[]).forEach(function(p){
      if(String(p.signal).indexOf('TURNING ON')!==-1)h+='<span style="color:#44aaff">↗ '+p.pair+' turning on</span>';
      if(String(p.signal).indexOf('TURNING OFF')!==-1)h+='<span style="color:#ff8844">↘ '+p.pair+' fading</span>';
    });
    // Credit stress
    if(d.rotation.creditVerdict && d.rotation.creditVerdict.indexOf('STRESS')!==-1){
      h+='<span style="color:#ff4444">⛔ '+d.rotation.creditVerdict.split('—')[0].trim()+'</span>';
    }
    // Sector confirmations
    (d.rotation.sectorSignals||[]).forEach(function(s){
      if(String(s.signal).indexOf('CONFIRMED')!==-1&&String(s.signal).indexOf('OFF')===-1)
        h+='<span style="color:#00dd88">✦ '+s.sector+' vs SPY CONFIRMED</span>';
    });
  }
  document.getElementById('alerts').innerHTML=h;
}

var AI_SYSTEM = 'You are a senior ETF rotation strategist analyzing a real-time sector rotation terminal. Write a concise 3-4 paragraph daily briefing. Be specific: cite exact tickers, ranks, percentages, and signals. Professional, direct, no hedging or disclaimers.\n\nStructure: (1) Regime + Breadth health. (2) Sector rotation calls with pair spread evidence. (3) Top picks aligned with regime. (4) Risk flags and playbook reminder.\n\nMax 250 words. Plain text paragraphs only. No headers, no markdown, no bullets, no asterisks.';

function fmtPct(v){if(v==null||isNaN(v))return'--';return(v>=0?'+':'')+(v*100).toFixed(1)+'%';}
function escHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function buildMarketContext(d){
  var lines=[];
  if(d.regime&&d.regime.signals){
    var v=getVerdict(d.regime.signals);
    lines.push('REGIME: '+v.label+' | Score: '+d.regime.score+'/7');
    if(d.regime.verdictFull)lines.push('Full verdict: '+d.regime.verdictFull);
    if(d.regime.implications){d.regime.implications.forEach(function(imp){if(imp.label&&v.label&&imp.label.toUpperCase().indexOf(v.label.toUpperCase())!==-1)lines.push('Playbook: '+imp.text);});}
    lines.push('Signals:');
    d.regime.signals.forEach(function(s){lines.push('  '+s.signal+' ('+s.proxy+'): 1M='+fmtPct(s.delta1m)+' | Trend='+s.trend+' | '+s.verdict);});
  }
  if(d.universe&&d.universe.length>0){
    var qd={LEADING:0,IMPROVING:0,WEAKENING:0,LAGGING:0};
    d.universe.forEach(function(u){var q=String(u.quadrant||'');if(q.indexOf('LEADING')!==-1)qd.LEADING++;else if(q.indexOf('IMPROVING')!==-1)qd.IMPROVING++;else if(q.indexOf('WEAKENING')!==-1)qd.WEAKENING++;else if(q.indexOf('LAGGING')!==-1)qd.LAGGING++;});
    var total=d.universe.length;
    lines.push('BREADTH ('+total+' ETFs): LEADING='+qd.LEADING+' ('+Math.round(qd.LEADING/total*100)+'%) IMPROVING='+qd.IMPROVING+' ('+Math.round(qd.IMPROVING/total*100)+'%) WEAKENING='+qd.WEAKENING+' ('+Math.round(qd.WEAKENING/total*100)+'%) LAGGING='+qd.LAGGING+' ('+Math.round(qd.LAGGING/total*100)+'%)');
  }
  if(d.rotation&&d.rotation.creditHealth){
    lines.push('CREDIT: '+(d.rotation.creditVerdict||''));
    d.rotation.creditHealth.forEach(function(c){lines.push('  '+c.pair+': d1W='+fmtPct(c.delta1w)+' d1M='+fmtPct(c.delta1m)+' '+c.trend+' '+c.status);});
  }
  if(d.sectorMap&&d.sectorMap.sectors){
    lines.push('SECTOR MAP (11 sectors):');
    d.sectorMap.sectors.forEach(function(s){lines.push('  '+s.ticker+' '+s.name+': RS='+fmtPct(s.rsVsSpy)+' '+(s.verdict||'')+' Breadth='+(s.breadthStatus||''));});
  }
  if(d.conviction&&d.conviction.top){
    lines.push('TOP 10 CONVICTION:');
    d.conviction.top.slice(0,10).forEach(function(c){lines.push('  #'+c.rank+' '+c.ticker+' ('+c.category+') RS='+fmtPct(c.composite)+' '+(c.convictionLabel||'')+' '+(c.rotation||'')+' Quad='+c.quadrant);});
  }
  if(d.conviction&&d.conviction.bottom){
    lines.push('BOTTOM 5 (AVOID):');
    d.conviction.bottom.slice(0,5).forEach(function(c){lines.push('  #'+c.rank+' '+c.ticker+' ('+c.category+') RS='+fmtPct(c.composite)+' '+(c.rotation||''));});
  }
  if(d.rotation){
    if(d.rotation.riskPairs&&d.rotation.riskPairs.length>0){lines.push('RISK PAIRS:');d.rotation.riskPairs.forEach(function(r){lines.push('  '+r.pair+': '+r.status);});}
    if(d.rotation.sectorSignals&&d.rotation.sectorSignals.length>0){lines.push('SECTOR SIGNALS:');d.rotation.sectorSignals.forEach(function(r){lines.push('  '+(r.pair||r.sector)+': '+(r.status||r.signal));});}
  }
  if(d.pairAnalysis){
    lines.push('PAIR SPREADS:');
    ['sectorRotation','industryDrillDown','crossAsset','custom'].forEach(function(key){if(d.pairAnalysis[key])d.pairAnalysis[key].forEach(function(p){lines.push('  '+p.num+'/'+p.den+': 3M='+fmtPct(p.spread3m)+' 12M='+fmtPct(p.spread12m));});});
  }
  if(d.emerging&&d.emerging.length>0){
    lines.push('EMERGING (top 5 weekly surge):');
    d.emerging.slice(0,5).forEach(function(e){lines.push('  '+e.ticker+' ('+e.category+') 1W='+fmtPct(e.rs1w)+' Note='+(e.note||''));});
  }
  return lines.join('\n');
}

function generateMarketPulse(){
  if(!S.data||S.aiPulseLoading)return;
  S.aiPulseLoading=true;
  renderWidgetById('aiPulse');
  var context=buildMarketContext(S.data);
  var prompt='Current terminal state. Give me today\'s briefing:\n\n'+context;
  google.script.run
    .withSuccessHandler(function(text){S.aiPulse=text;S.aiPulseTime=new Date().toLocaleTimeString();S.aiPulseLoading=false;renderWidgetById('aiPulse');})
    .withFailureHandler(function(err){S.aiPulse='Failed to generate: '+(err.message||err);S.aiPulseLoading=false;renderWidgetById('aiPulse');})
    .callClaude(prompt,AI_SYSTEM);
}

function sendAIChat(){
  var input=document.getElementById('aiChatInput');
  if(!input)return;
  var q=input.value.trim();if(!q)return;
  S.aiChat.push({role:'user',content:q});
  S.aiChat.push({role:'assistant',content:'...'});
  input.value='';
  renderWidgetById('aiPulse');
  var context=buildMarketContext(S.data);
  var prompt='Terminal data:\n'+context+'\n\n';
  var hist=S.aiChat.slice(0,-1).slice(-4);
  if(hist.length>0){prompt+='Previous conversation:\n';hist.forEach(function(m){prompt+=(m.role==='user'?'User: ':'Assistant: ')+m.content+'\n';});prompt+='\n';}
  prompt+='User question: '+q;
  var chatSys='You are a senior ETF rotation strategist. Answer questions about the terminal data concisely (2-4 sentences) with specific tickers, numbers, and signals. Plain text only. No markdown, no bullets.';
  google.script.run
    .withSuccessHandler(function(text){S.aiChat[S.aiChat.length-1]={role:'assistant',content:text};if(S.aiChat.length>6)S.aiChat=S.aiChat.slice(-6);renderWidgetById('aiPulse');})
    .withFailureHandler(function(err){S.aiChat[S.aiChat.length-1]={role:'assistant',content:'Error: '+(err.message||err)};renderWidgetById('aiPulse');})
    .callClaude(prompt,chatSys);
}

  h+='<button class="lt-btn" onclick="sendAIChat()" style="padding:4px 10px;font-size:9px">→</button>';
  h+='</div>';
  if(S.aiChat.length>0){
    h+='<div style="margin-top:8px;max-height:200px;overflow-y:auto">';
    S.aiChat.forEach(function(msg){
      if(msg.role==='user'){h+='<div style="color:#ff8800;font-size:9px;margin:4px 0 2px;font-weight:600">You: '+escHtml(msg.content)+'</div>';}
      else{h+='<div style="color:#c8d6e5;font-size:9px;margin:2px 0 6px;line-height:1.5;padding-left:8px;border-left:2px solid #1a2744">'+escHtml(msg.content)+'</div>';}
    });
    h+='</div>';
  }
  h+='</div>';
  bodyEl.innerHTML=h;

function renderChangesWidget(bodyEl){
  var d=S.data; var ch=d.changes||{}; var items=ch.items||[]; var hasPrev=ch.hasPrevious;
  var html='<div class="changes-panel">';
  html+='<div class="changes-hdr" onclick="S.changesOpen=!S.changesOpen;renderWidgetById(\'changes\')">';
  html+='<span class="changes-title">⚡ WHAT CHANGED'+(hasPrev?' SINCE '+(ch.prevDate||'').toUpperCase():' ')+'</span>';
  html+='<span class="changes-toggle">'+(S.changesOpen?'▾':'▸')+'</span>';
  html+='</div>';
  html+='<div class="changes-body'+(S.changesOpen?'':' collapsed')+'">';
  if(!hasPrev){
    html+='<div class="changes-empty">No snapshot history yet — run <span style="color:#ff8800">snapshotSignals()</span> from Apps Script to start tracking changes</div>';
  } else if(items.length===0){

function pairDivergence(s3, s12) {
  if (s3==null||s12==null) return {label:'—',color:'#555'};
  if (s3>0.03&&s12>0.03) return {label:'✦ confirmed',color:'#00dd88'};
  if (s3>0&&s12>0&&s3<s12*0.5) return {label:'▼ weakening',color:'#ff8844'};
  if (s3>0&&s12>0) return {label:'▲ leading',color:'#44aaff'};
  if (s3>0&&s12<0) return {label:'↗ turning',color:'#44aaff'};
  if (s3<-0.03&&s12<-0.03) return {label:'▼ lagging',color:'#ff5555'};
  if (s3<0&&s12>0) return {label:'↘ fading',color:'#ff8844'};
  if (s3<0) return {label:'▼ lagging',color:'#ff5555'};
  return {label:'— flat',color:'#888'};
}

  html+='<div class="panel s2"><div class="phdr">CREDIT MARKET MONITOR</div><table><thead><tr><th>RATIO</th><th>MEASURES</th><th class="r">Δ 1W</th><th class="r">Δ 1M</th><th class="r">Δ 3M</th><th class="r">Δ 6M</th><th class="r">Δ 12M</th><th class="r">COMPOSITE</th><th class="r">RK</th></tr></thead><tbody>';
  (d.credit.spreads||[]).forEach(function(c){
    html+='<tr><td class="tk">'+c.ratio+'</td><td class="dim">'+c.measures+'</td><td class="r" style="color:'+vc(c.d1w)+'">'+pct(c.d1w)+'</td><td class="r" style="color:'+vc(c.d1m)+'">'+pct(c.d1m)+'</td><td class="r" style="color:'+vc(c.d3m)+'">'+pct(c.d3m)+'</td><td class="r" style="color:'+vc(c.d6m)+'">'+pct(c.d6m)+'</td><td class="r" style="color:'+vc(c.d12m)+'">'+pct(c.d12m)+'</td><td class="r" style="font-weight:700;color:'+vc(c.composite)+'">'+pct(c.composite)+'</td><td class="r dimx">'+c.rank+'</td></tr>';
  });
  html+='</tbody></table></div>';
  html+='</div>';
  document.getElementById('main').innerHTML=html;
}
// ═══════════════════════════════════════════════════════
// ETF PROFILE PANEL
// ═══════════════════════════════════════════════════════
function openProfile(ticker){
  if(!ticker||!S.data) return;
  S.profileTicker = ticker;
  var d = S.data;
  // Find ETF in universe
  var etf = null;
  (d.universe||[]).forEach(function(u){ if(u.ticker===ticker) etf=u; });
  // Find in conviction
  var conv = null;
  var convTop = (d.conviction && d.conviction.top) ? d.conviction.top : (Array.isArray(d.conviction) ? d.conviction : []);
  convTop.forEach(function(c){ if(c.ticker===ticker) conv=c; });
  // Also check bottom
  var convBot = (d.conviction && d.conviction.bottom) ? d.conviction.bottom : [];
  convBot.forEach(function(c){ if(c.ticker===ticker && !conv) conv=c; });
  // Determine parent sector
  var parentTicker = null, parentSec = null;
  var cat = (etf && etf.category) || (conv && conv.category) || '';
  (d.sectorMap.sectors||[]).forEach(function(s){
    if(s.name === cat || s.ticker === ticker) { parentTicker = s.ticker; parentSec = s; }
  });
  // Try drill-down lookup if no parent match by name
  if(!parentTicker){
    for(var key in (d.drillDown||{})){
      (d.drillDown[key]||[]).forEach(function(sub){
        if(sub.ticker===ticker){ parentTicker=key; }
      });
      if(parentTicker) break;
    }
    if(parentTicker){
      (d.sectorMap.sectors||[]).forEach(function(s){ if(s.ticker===parentTicker) parentSec=s; });
    }
  }
  // Find this ETF in drill-down for sector context
  var drillEntry = null;
  if(parentTicker && d.drillDown && d.drillDown[parentTicker]){
    (d.drillDown[parentTicker]).forEach(function(sub){ if(sub.ticker===ticker) drillEntry=sub; });
  }
  // Peers from same parent sector
  var peers = [];
  if(parentTicker && d.drillDown && d.drillDown[parentTicker]){
    peers = d.drillDown[parentTicker].slice(0,5);
  }
  // Merge data sources
  var rank = (etf && etf.rank) || (conv && conv.rank) || '—';
  var name = (etf && etf.name) || (conv && conv.name) || (drillEntry && drillEntry.name) || '';
  var type = (etf && etf.type) || (conv && conv.type) || (drillEntry && drillEntry.type) || '';
  var percentile = (etf && etf.percentile) || (conv && conv.percentile) || null;
  var composite = (etf && etf.composite) || (conv && conv.composite) || (drillEntry && drillEntry.rsVsSpy) || null;
  var quadrant = (etf && etf.quadrant) || (conv && conv.quadrant) || (drillEntry && drillEntry.quadrant) || '';
  var momentum = (etf && etf.momentum) || (conv && conv.momentum) || (drillEntry && drillEntry.momentum) || null;
  var rs1w = (etf && etf.rs1w) || (conv && conv.rs1w) || (drillEntry && drillEntry.rs1w) || null;
  var rs1m = (etf && etf.rs1m) || (conv && conv.rs1m) || (drillEntry && drillEntry.rs1m) || null;
  var rs3m = (etf && etf.rs3m) || (conv && conv.rs3m) || (drillEntry && drillEntry.rs3m) || null;
  var rs6m = (etf && etf.rs6m) || null;
  var rs12m = (etf && etf.rs12m) || null;
  var accel = (conv && conv.accel) || null;
  var rotation = (conv && conv.rotation) || '';
  var cvLabel = (conv && conv.convictionLabel) || '';
  var rsVsSector = (drillEntry && drillEntry.rsVsSector) || null;
  var sectorRank = (drillEntry && drillEntry.sectorRank) || null;
  var totalUni = (d.universe||[]).length || 237;
  // Build HTML
  var h = '';
  // Header
  h+='<div class="prof-hdr"><div>';
  h+='<div style="display:flex;align-items:center;gap:8px"><span style="font-size:16px;font-weight:800;color:#e8f0ff">'+ticker+'</span>';
  h+='<span class="badge" style="'+typeBg(type)+'">'+type+'</span></div>';
  h+='<div style="font-size:9px;color:#7a8899;margin-top:2px">'+name+'</div>';
  if(cat) h+='<div style="font-size:8px;color:#556677;margin-top:1px">'+cat+'</div>';
  h+='</div><button class="prof-close" onclick="closeProfile()">✕</button></div>';
  // Key metrics
  h+='<div style="display:flex;gap:6px;padding:6px 10px">';
  h+='<div style="flex:1;text-align:center"><div style="font-size:7px;color:#556677">RANK</div><div style="font-size:13px;font-weight:700;color:#e8f0ff">#'+rank+' <span style="font-size:8px;color:#445566">/ '+totalUni+'</span></div></div>';
  h+='<div style="flex:1;text-align:center"><div style="font-size:7px;color:#556677">PERCENTILE</div><div style="font-size:13px;font-weight:700;color:#e8f0ff">'+(percentile!=null?((percentile*100).toFixed(0)+'th'):'—')+'</div></div>';
  h+='<div style="flex:1;text-align:center"><div style="font-size:7px;color:#556677">QUADRANT</div><div style="font-size:11px;font-weight:700;color:'+qc(quadrant)+'">'+quadrant.replace('RRG ','')+'</div></div>';
  h+='</div>';
  // RS vs SPY big number
  h+='<div style="padding:4px 10px;text-align:center"><div style="font-size:7px;color:#556677;margin-bottom:2px">RS vs SPY</div>';
  h+='<div class="prof-bigrs" style="color:'+vc(composite)+'">'+pct(composite)+'</div>';
  var barPct = composite!=null ? Math.min(Math.max((composite*100+50),0),100) : 50;
  h+='<div class="prof-bar"><div class="prof-bar-fill" style="width:'+barPct+'%;background:'+(composite>=0?'#00dd88':'#ff5555')+'"></div></div></div>';
  // Relative Strength section
  h+='<div class="prof-sec"><div class="prof-sec-hdr">RELATIVE STRENGTH</div><div class="prof-sec-body">';
  h+='<div style="display:flex;gap:4px;margin-bottom:4px">';
  var rsPeriods=[{l:'1W',v:rs1w},{l:'1M',v:rs1m},{l:'3M',v:rs3m},{l:'6M',v:rs6m},{l:'12M',v:rs12m}];
  rsPeriods.forEach(function(p){
    h+='<div style="flex:1;text-align:center"><div style="font-size:7px;color:#556677">'+p.l+'</div><div style="font-size:10px;font-weight:600;color:'+vc(p.v)+'">'+pct(p.v)+'</div></div>';
  });
  h+='</div>';
  h+='<div style="text-align:center;padding:4px 0">'+spark(ann(rs1w,rs1m,rs3m,rs6m,rs12m),200,30)+'</div>';
  h+='</div></div>';
  // Conviction Assessment
  h+='<div class="prof-sec"><div class="prof-sec-hdr">CONVICTION ASSESSMENT</div><div class="prof-sec-body">';
  if(cvLabel){
    h+='<div style="font-size:11px;font-weight:700;color:'+cvlColor(cvLabel)+';margin-bottom:4px">'+cvLabel+'</div>';
  }
  h+='<div class="prof-row"><span class="prof-lbl">Momentum</span><span class="prof-val" style="color:'+vc(momentum)+'">'+pct(momentum)+'</span></div>';
  h+='<div class="prof-row"><span class="prof-lbl">Acceleration</span><span class="prof-val" style="color:'+vc(accel)+'">'+pct(accel)+'</span></div>';
  h+='<div class="prof-row"><span class="prof-lbl">Rotation</span><span class="prof-val" style="color:'+sc(rotation)+'">'+rotation+'</span></div>';
  h+='</div></div>';
  // Sector Context
  if(parentSec || rsVsSector!=null){
    h+='<div class="prof-sec"><div class="prof-sec-hdr">SECTOR CONTEXT</div><div class="prof-sec-body">';
    if(parentSec){
      h+='<div class="prof-row"><span class="prof-lbl">Parent</span><span class="prof-val" style="color:#e8f0ff">'+parentSec.ticker+' — '+parentSec.name+' (#'+parentSec.rank+')</span></div>';
    }
    h+='<div class="prof-row"><span class="prof-lbl">RS vs Sector</span><span class="prof-val" style="color:'+vc(rsVsSector)+'">'+pct(rsVsSector)+'</span></div>';
    if(sectorRank!=null){
      h+='<div class="prof-row"><span class="prof-lbl">Sector Rank</span><span class="prof-val" style="color:#e8f0ff">#'+sectorRank+'</span></div>';
    }
    h+='</div></div>';
  }
  // Peers
  if(peers.length>0){
    h+='<div class="prof-sec"><div class="prof-sec-hdr">PEERS ('+((parentSec && parentSec.name)||parentTicker||'sector')+')</div><div class="prof-sec-body">';
    peers.forEach(function(p){
      var isMe = p.ticker===ticker;
      h+='<div class="prof-peer" style="'+(isMe?'background:#ffffff08;border-radius:3px;padding:3px 4px':'')+'">';
      h+='<span style="color:#556677;font-size:9px;width:20px">#'+p.rank+'</span>';
      h+='<span style="font-weight:700;color:'+(isMe?'#ff8800':'#e8f0ff')+';width:48px;cursor:pointer" onclick="openProfile(\''+p.ticker+'\')">'+p.ticker+'</span>';
      h+='<span style="color:'+vc(p.rs3m||p.rsVsSpy)+';flex:1">'+pct(p.rs3m||p.rsVsSpy)+'</span>';
      h+='<span style="color:'+qc(p.quadrant)+';font-size:8px">'+p.quadrant.replace('RRG ','')+'</span>';
      h+='</div>';
    });
    h+='</div></div>';
  }
  // TradingView button
  h+='<button class="prof-btn" onclick="closeProfile();S.drillSector=\''+(parentTicker||ticker)+'\';S.chartTicker=\''+ticker+'\';if(S.gridInitialized){renderWidgetById(\'drillDown\');renderWidgetById(\'tvChart\');renderWidgetById(\'heatmap\');}else{render();}">📊 Open TradingView Chart</button>';
  document.getElementById('profilePanel').innerHTML = h;
  document.getElementById('profilePanel').classList.add('open');
  document.getElementById('profileBackdrop').classList.add('open');
}
function closeProfile(){
  S.profileTicker = null;
  document.getElementById('profilePanel').classList.remove('open');
  document.getElementById('profileBackdrop').classList.remove('open');
}
// ═══ KEYBOARD ═══
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ closeProfile(); }
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();S.tab='UNIVERSE';render();setTimeout(function(){var el=document.getElementById('usearch');if(el)el.focus();},50);}
  if(e.key==='r'&&(e.metaKey||e.ctrlKey)){e.preventDefault();loadData();}
  if((e.metaKey||e.ctrlKey)&&e.key==='g'){e.preventDefault();S.tab='GLOBAL';render();setTimeout(function(){var el=document.getElementById('gsearch');if(el)el.focus();},50);}
  if(e.altKey&&e.key==='t'){e.preventDefault();S.tab='THEMATIC';render();setTimeout(function(){var el=document.getElementById('tsearch');if(el)el.focus();},50);}
  if(S.tab==='DASHBOARD'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&e.target.tagName!=='INPUT'){
    if(e.key==='l'||e.key==='L'){e.preventDefault();toggleLayoutLock();}
    if(!S.layoutLocked){
      if(e.key==='1'){e.preventDefault();applyPreset('ANALYST');}
      if(e.key==='2'){e.preventDefault();applyPreset('TRADER');}
      if(e.key==='3'){e.preventDefault();applyPreset('MACRO');}
    }
  }
});
// ═══ INIT ═══
loadSavedLayout();
loadData();
</script>
